{% extends "main.html" %}

{% block tabs %}
  {{ super() }}

  <style>
    .md-header {
      position: initial;
    }

    .md-main__inner {
      margin-top: 0;
    }

    @media screen and (min-width: 60em) {
      .md-sidebar--secondary {
        display: none;
      }
    }

    @media screen and (min-width: 76.25em) {
      .md-sidebar--primary {
        display: none;
      }
    }
  </style>

  <section class="robotics-parallax" data-robotics-parallax>
    <div class="robotics-parallax__sticky">
      <div class="robotics-parallax__scene" aria-hidden="true">
        <div class="robotics-parallax__sky"></div>
        <div class="robotics-parallax__nebula robotics-parallax__nebula--one"></div>
        <div class="robotics-parallax__nebula robotics-parallax__nebula--two"></div>
        <div class="robotics-parallax__aurora"></div>
        <div class="robotics-parallax__horizon-glow"></div>
        <div class="robotics-parallax__sun"></div>
        <div class="robotics-parallax__stars"></div>
        <div class="robotics-parallax__meteor robotics-parallax__meteor--one"></div>
        <div class="robotics-parallax__meteor robotics-parallax__meteor--two"></div>
        <div class="robotics-parallax__meteor robotics-parallax__meteor--three"></div>
        <div class="robotics-parallax__mountains robotics-parallax__mountains--back"></div>
        <div class="robotics-parallax__mountains robotics-parallax__mountains--front"></div>
        <div class="robotics-parallax__grid"></div>
        <div class="robotics-parallax__platform"></div>
        <div class="robotics-parallax__robot">
          <div class="robotics-orbital">
            <div class="robotics-orbital__glow"></div>
            <div class="robotics-orbital__ring robotics-orbital__ring--outer"></div>
            <div class="robotics-orbital__ring robotics-orbital__ring--inner"></div>
            <div class="robotics-orbital__core"></div>
            <div class="robotics-orbital__node robotics-orbital__node--one"></div>
            <div class="robotics-orbital__node robotics-orbital__node--two"></div>
            <div class="robotics-orbital__node robotics-orbital__node--three"></div>
            <div class="robotics-orbital__panel robotics-orbital__panel--one">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="robotics-orbital__panel robotics-orbital__panel--two">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="robotics-orbital__rover">
              <span class="robotics-orbital__mast"></span>
              <span class="robotics-orbital__body"></span>
              <span class="robotics-orbital__arm"></span>
              <span class="robotics-orbital__wheel robotics-orbital__wheel--one"></span>
              <span class="robotics-orbital__wheel robotics-orbital__wheel--two"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="md-grid md-typeset">
        <div class="robotics-parallax__content">
          <p class="robotics-parallax__eyebrow">Robotics Tutorial</p>
          <h1>
            <span>机器人体系化</span>
            <span>教学文档</span>
          </h1>
          <p>
            从数学基础、C++/ROS2、SLAM、规划控制、运动控制到具身智能，
            构建一套可检索、可扩展、适合长期学习的机器人知识体系。
          </p>
          <div class="robotics-parallax__actions">
            <a href="{{ 'catalog/' | url }}" class="md-button md-button--primary">
              浏览目录
            </a>
            <a href="{{ 'project/' | url }}" class="md-button">
              项目说明
            </a>
            <a href="https://github.com/Michael-Jetson/Robotics_Tutorial" class="md-button">
              GitHub
            </a>
          </div>
        </div>
      </div>

      <div class="robotics-parallax__shade" aria-hidden="true"></div>
    </div>
  </section>
{% endblock %}
