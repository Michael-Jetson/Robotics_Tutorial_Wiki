site_name: Robotics Tutorial
site_description: 系统化机器人学教学文档，覆盖数学、工程基础、SLAM、规划控制、运动控制与具身智能。
site_author: Pengfei Guo
repo_name: Michael-Jetson/Robotics_Tutorial
repo_url: https://github.com/Michael-Jetson/Robotics_Tutorial
edit_uri: edit/main/
docs_dir: .generated/docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    logo: material/robot-industrial

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
  - stylesheets/company-promo.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/home-parallax.js
  - javascripts/company-promo.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  company_promo:
    enabled: true
    mode: mixed
    initial_delay_seconds: 4
    interval_seconds: 16
    duration_seconds: 6.4
    title: 机器人体系化教学文档
    subtitle: 智能机器人教学与工程实践
    slogan: 体系化学习，工程化成长
    left: 深耕机器人技术
    right: 共建智能未来
    center: Robotics Tutorial
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Michael-Jetson/Robotics_Tutorial
